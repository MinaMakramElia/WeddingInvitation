<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mina & Aro | Wedding Invitation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

  <style>
    :root {
      --bg-color: #FFFFFF;        
      --card-bg: #FFFFFF;          
      --box-bg: #FAF7F2;           
      --primary-accent: #C48B9F;   
      --secondary-accent: #8DA9C4; 
      --text-main: #333333;
      --text-muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      overflow-x: hidden;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      padding: 20px 16px 40px 16px;
      text-align: center;
      position: relative;
    }

    /* Video Container Styling */
    .illustration-container {
      width: 100%;
      max-width: 320px;
      margin: 0 auto 24px auto;
      border-radius: 20px;
      overflow: hidden;
      will-change: transform;
      transition: transform 0.1s linear;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .illustration-container video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
      object-fit: cover;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--primary-accent);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .divider {
      width: 50px;
      height: 2px;
      background-color: var(--primary-accent);
      margin: 20px auto;
      opacity: 0.5;
    }

    .details-box {
      background-color: var(--box-bg);
      border-radius: 20px;
      padding: 24px 20px;
      margin: 24px 0;
    }

    .detail-item { margin: 12px 0; }

    .detail-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .detail-val {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Countdown */
    .timer-container { margin: 32px 0; }

    .timer-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .time-unit {
      background: var(--box-bg);
      padding: 12px 14px;
      border-radius: 14px;
      min-width: 65px;
    }

    .number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--primary-accent);
    }

    .label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Wishes & Guestbook Section */
    .wishes-section {
      background-color: var(--box-bg);
      border-radius: 20px;
      padding: 24px 20px;
      margin: 32px 0 24px 0;
      text-align: left;
    }

    .wishes-title {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .wishes-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #E2DCD5;
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      background: #FFFFFF;
      outline: none;
    }

    textarea.form-control { resize: vertical; min-height: 80px; }

    .btn-submit {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 30px;
      background-color: var(--primary-accent);
      color: #FFFFFF;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(196, 139, 159, 0.25);
    }

    .guestbook-feed {
      margin-top: 24px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .wish-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-left: 3px solid var(--primary-accent);
    }

    .wish-author {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .wish-text {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
    }

    .btn-secondary {
      border: 1.5px solid var(--secondary-accent);
      color: var(--secondary-accent);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="illustration-container" id="heroIllustration" data-aos="zoom-in" data-aos-duration="900">
      <video autoplay loop muted playsinline poster="edited-image.png">
        <source src="our-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div data-aos="fade-down" data-aos-duration="800">
      <h1>Mina & Aro</h1>
      <p class="subtitle">Are Getting Married!</p>
    </div>

    <div class="divider" data-aos="zoom-in"></div>

    <div class="details-box" data-aos="flip-up" data-aos-duration="800">
      <div class="detail-item">
        <span class="detail-label">Date & Time</span>
        <div class="detail-val">Saturday, September 26, 2026</div>
        <div style="font-size: 0.9rem; color: #666; margin-top: 2px;">At 5:00 PM</div>
      </div>

      <div class="divider" style="margin: 14px auto; width: 30px;"></div>

      <div class="detail-item">
        <span class="detail-label">Location</span>
        <div class="detail-val">Saint George Church</div>
      </div>
    </div>

    <div class="timer-container" data-aos="zoom-in-up" data-aos-duration="700">
      <p class="timer-title">Counting Down To The Celebration</p>
      <div class="countdown">
        <div class="time-unit"><span class="number" id="days">00</span><span class="label">Days</span></div>
        <div class="time-unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
        <div class="time-unit"><span class="number" id="minutes">00</span><span class="label">Mins</span></div>
        <div class="time-unit"><span class="number" id="seconds">00</span><span class="label">Secs</span></div>
      </div>
    </div>

    <div class="wishes-section" data-aos="fade-up" data-aos-duration="800">
      <h2 class="wishes-title">Guestbook & Wishes</h2>
      <p class="wishes-subtitle">Leave a public wish for Mina & Aro</p>

      <form id="guestbookForm">
        <div class="form-group">
          <label for="guestName">Your Name</label>
          <input type="text" id="guestName" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="guestMessage">Your Wish</label>
          <textarea id="guestMessage" class="form-control" placeholder="Write your wish..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Post Wish ✨</button>
      </form>

      <div class="guestbook-feed" id="guestbookFeed"></div>
    </div>

    <div class="btn-group" data-aos="fade-up" data-aos-duration="800">
      <a href="https://maps.app.goo.gl/vv3snLuyhHhoiGrAA" class="btn btn-secondary" target="_blank">View Location on Maps</a>
    </div>

  </div>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    AOS.init({ once: false, mirror: true, duration: 700 });

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "minaarowedding.firebaseapp.com",
      databaseURL: "https://minaarowedding-default-rtdb.firebaseio.com",
      projectId: "minaarowedding",
      storageBucket: "minaarowedding.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const wishesRef = db.ref("wishes");

    document.getElementById('guestbookForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('guestName').value;
      const message = document.getElementById('guestMessage').value;

      wishesRef.push({
        name: name,
        message: message,
        timestamp: Date.now()
      });

      document.getElementById('guestbookForm').reset();
    });

    wishesRef.on('value', (snapshot) => {
      const feed = document.getElementById('guestbookFeed');
      feed.innerHTML = '';
      const data = snapshot.val();
      
      if (data) {
        Object.values(data).reverse().forEach(item => {
          const card = document.createElement('div');
          card.className = 'wish-card';
          card.innerHTML = `<div class="wish-author">${item.name}</div><div class="wish-text">${item.message}</div>`;
          feed.appendChild(card);
        });
      }
    });

    const heroImg = document.getElementById('heroIllustration');
    window.addEventListener('scroll', () => {
      let scrollPosition = window.scrollY;
      heroImg.style.transform = `translateY(${scrollPosition * 0.08}px) rotate(${scrollPosition * 0.01}deg)`;
    });

    const weddingDate = new Date("2026-09-26T17:00:00").getTime();
    setInterval(function() {
      const now = new Date().getTime();
      const distance = weddingDate - now;
      if (distance < 0) return;
      document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
      document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
    }, 1000);
  </script>
</body>
</html>
